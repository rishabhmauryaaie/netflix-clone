<!doctype html>
<html>
  <head>
    <title>Netflix Clone</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="hero-section">
      <!-- Navbar -->
      <nav>
        <!-- Logo -->
        <div class="brand">
          <img src="./images/netflix-logo.svg" alt="Netflix logo" />
        </div>

        <!-- Button Group -->
        <div>
          <select name="English" id="language" class="language-btn btn">
            <option value="english">English</option>
            <option value="espanol">Espanol</option>
          </select>
          <button class="sign-in-btn btn">Sign In</button>
        </div>
      </nav>
      <div class="hero">
        <h1>Unlimited movies, TV shows, and more</h1>
        <p>Starts at $8.99. Cancel anytime.</p>
        <p>
          Ready to watch? Enter your email to create or restart your membership.
        </p>

        <!-- form -->
        <div class="input-div">
          <input placeholder="Email address" class="email" />
          <button class="btn2">Get Started  ➜</button>
        </div>
      </div>
    </section>
  </body>
</html>
